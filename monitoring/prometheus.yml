global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aigx-cluster'
    region: 'production'
    node: 'aigx-node-1'

# 告警规则
rule_files:
  - 'alerts.yml'

# 告警例子
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# 原始采集目标
scrape_configs:
  # AIGX 后端节点
  - job_name: 'aigx-backend'
    static_configs:
      - targets: ['aigx-backend:9527']
        labels:
          service: 'aigx-backend'
          instance: 'aigx-backend-1'

  # AIGX 前端节点
  - job_name: 'aigx-frontend'
    static_configs:
      - targets: ['aigx-frontend:80']
        labels:
          service: 'aigx-frontend'
          instance: 'aigx-frontend-1'

  # PostgreSQL 数据库
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Redis 缓存
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter 系统指标
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # AIGX 网络层自定义指标
  - job_name: 'aigx-network'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['aigx-backend:9527']
        labels:
          service: 'aigx-network'
          instance: 'network-node-1'