# AIGX 告警规则
#
# 指标事实来源：src/metrics.rs::Metrics::render() 实际输出的 /metrics 指标集
# （aigx_requests_total / aigx_tokens_total / aigx_latency_ms_sum+count /
#  aigx_request_latency_bucket+sum+count / aigx_health_level /
#  aigx_requests_inflight / aigx_channels_enabled+disabled /
#  aigx_cost_usd_total / aigx_cost_cny_total）。
#
# 规则约束：
#   - expr 只允许引用上述已导出指标，不得引用 /metrics 中不存在的指标
#     （历史版本引用 aigx_cpu_usage_percent / aigx_error_rate_percent 等
#     幽灵指标，且混入非法 YAML 残片与重复顶层 groups 键，导致规则文件
#     整体加载失败、告警体系全灭）。
#   - 本文件的 YAML 合法性与指标存在性由 CI 闸门校验，见
#     .github/workflows/alerts-lint.yml（重复键严格加载 + 指标存在性比对）。

groups:
  # ------------------------------------------------------------------
  # 可用性
  # ------------------------------------------------------------------
  - name: aigx_availability
    interval: 30s
    rules:
      # 错误率：5m 窗口内 error 占比 > 5%（无流量时 rate 为 NaN，比较不成立，
      # 不会误报）
      - alert: AigxHighErrorRate
        expr: |
          sum(rate(aigx_requests_total{status="error"}[5m]))
          /
          sum(rate(aigx_requests_total[5m]))
          > 0.05
        for: 10m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "AIGX 请求错误率过高"
          description: "近 5 分钟错误请求占比 {{ $value | humanizePercentage }}，阈值 5%"

      # 后端实例不可达（采集层 up=0；job 名与 monitoring/prometheus.yml 的
      # aigx-backend scrape job 对应，由 CI 校验交叉一致）
      - alert: AigxBackendUnreachable
        expr: up{job="aigx-backend"} == 0
        for: 2m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "AIGX 后端 /metrics 不可采集"
          description: "Prometheus 连续 2 分钟无法采集 aigx-backend:9527/metrics（检查服务存活与 AIGX_METRICS_TOKEN 凭据）"

      # 无任何可用渠道：网关无法路由任何请求（业务可用性）
      - alert: AigxNoChannelsEnabled
        expr: aigx_channels_enabled == 0
        for: 5m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "AIGX 无可用渠道"
          description: "渠道启用数为 0，持续 5 分钟；请检查渠道管理页是否全部禁用"

  # ------------------------------------------------------------------
  # 延迟
  # ------------------------------------------------------------------
  - name: aigx_latency
    interval: 30s
    rules:
      # p95 延迟：直方图分桶（le 边界 10ms~60s，src/metrics.rs
      # LATENCY_BUCKETS_MS）按 le 聚合后取 95 分位，阈值 2000ms
      - alert: AigxHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(aigx_request_latency_bucket[5m])) by (le)
          ) > 2000
        for: 10m
        labels:
          severity: warning
          component: latency
        annotations:
          summary: "AIGX p95 请求延迟过高"
          description: "近 5 分钟 p95 延迟 {{ $value }}ms，阈值 2000ms"

  # ------------------------------------------------------------------
  # 容量
  # ------------------------------------------------------------------
  - name: aigx_capacity
    interval: 30s
    rules:
      # 在途请求积压：inflight 持续高于阈值说明下游处理能力不足
      - alert: AigxHighInflight
        expr: aigx_requests_inflight > 50
        for: 10m
        labels:
          severity: warning
          component: capacity
        annotations:
          summary: "AIGX 在途请求数过高"
          description: "当前在途请求 {{ $value }}，持续 10 分钟高于阈值 50"

  # ------------------------------------------------------------------
  # 模型健康
  # ------------------------------------------------------------------
  - name: aigx_health
    interval: 30s
    rules:
      # 健康等级 0=healthy 1=degraded 2=down（与 health::HealthLevel 对齐）
      - alert: AigxModelDown
        expr: aigx_health_level == 2
        for: 5m
        labels:
          severity: critical
          component: health
        annotations:
          summary: "模型 {{ $labels.model }} 已宕机"
          description: "模型 {{ $labels.model }} 健康等级为 down（2），持续 5 分钟"

      - alert: AigxModelDegraded
        expr: aigx_health_level == 1
        for: 10m
        labels:
          severity: warning
          component: health
        annotations:
          summary: "模型 {{ $labels.model }} 降级运行"
          description: "模型 {{ $labels.model }} 健康等级为 degraded（1），持续 10 分钟"

