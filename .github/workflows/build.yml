# AIGX 多平台构建 Workflow
# 自动编译所有平台的二进制文件，并推送到 GitHub Releases

name: Multi-platform Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  release:
    types: [ created ]
  # 允许手动触发
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - docker

env:
  RUST_TOOLCHAIN: stable

# workflow_dispatch 触发的 tag 重建也需要写 Release 的权限
permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  # Linux AMD64 构建任务
  # -----------------------------------------------------------------
  build-linux-amd64:
    name: Build Linux AMD64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compile toolchain
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --bin cross --locked

      - name: Build Linux AMD64
        run: |
          mkdir -p build/2024-Linux-x86_64
          cross build --release --target x86_64-unknown-linux-gnu
          mv target/x86_64-unknown-linux-gnu/release/aigx build/2024-Linux-x86_64/aigx

      - name: Strip binary
        run: |
          strip build/2024-Linux-x86_64/aigx
          file build/2024-Linux-x86_64/aigx

      - name: Upload AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-linux-amd64
          path: build/2024-Linux-x86_64/
          retention-days: 30

  # -----------------------------------------------------------------
  # Linux ARM64 构建任务
  # -----------------------------------------------------------------
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt, clippy

      - name: Install cross compiler for ARM64
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install aarch64 strip
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Linux ARM64
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo build --release --target aarch64-unknown-linux-gnu
          mkdir -p build/2024-Linux-arm64
          mv target/aarch64-unknown-linux-gnu/release/aigx build/2024-Linux-arm64/aigx

      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip build/2024-Linux-arm64/aigx
          file build/2024-Linux-arm64/aigx

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-linux-arm64
          path: build/2024-Linux-arm64/
          retention-days: 30

  # -----------------------------------------------------------------
  # Windows AMD64 构建任务
  # -----------------------------------------------------------------
  build-windows-amd64:
    name: Build Windows AMD64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          targets: x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-win-amd64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows AMD64
        shell: cmd
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          if not exist build mkdir build
          if not exist build\2024-Windows-x86_64 mkdir build\2024-Windows-x86_64
          copy target\x86_64-pc-windows-gnu\release\aigx.exe build\2024-Windows-x86_64\aigx.exe

      - name: Upload Windows AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-windows-amd64
          path: build/2024-Windows-x86_64/
          retention-days: 30

  # -----------------------------------------------------------------
  # macOS Intel 构建任务
  # -----------------------------------------------------------------
  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-darwin-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build macOS Intel
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p build/2024-macOS-x86_64
          cp target/x86_64-apple-darwin/release/aigx build/2024-macOS-x86_64/aigx
          strip build/2024-macOS-x86_64/aigx

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-macos-x86_64
          path: build/2024-macOS-x86_64/
          retention-days: 30

  # -----------------------------------------------------------------
  # macOS Apple Silicon 构建任务
  # -----------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-darwin-arm64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build macOS Apple Silicon
        run: |
          mkdir -p build/2024-macOS-arm64
          cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/aigx build/2024-macOS-arm64/aigx
          strip build/2024-macOS-arm64/aigx

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-macos-arm64
          path: build/2024-macOS-arm64/
          retention-days: 30

  # -----------------------------------------------------------------
  # 建立 Release（收集所有构建）
  # -----------------------------------------------------------------
  create-release:
    name: Create Release from Artifacts
    needs: [build-linux-amd64, build-linux-arm64, build-windows-amd64, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: |
          find artifacts -type f

      - name: Create Release Package
        run: |
          # 资产命名：AIGX-{version}-{platform}（版本取 tag 名去掉 v 前缀；
          # 非 tag 触发时用 VERSION 文件兜底）
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(cat VERSION)
          fi
          echo "AIGX_VERSION=$VER" >> "$GITHUB_ENV"
          mkdir -p release-package
          # artifacts/<artifact-name>/aigx|aigx.exe —— AIGX-{version}-{platform} 命名
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            case "$name" in
              aigx-linux-amd64)    out="AIGX-$VER-linux-amd64" ;;
              aigx-linux-arm64)    out="AIGX-$VER-linux-arm64" ;;
              aigx-windows-amd64) out="AIGX-$VER-windows-amd64.exe" ;;
              aigx-macos-x86_64)   out="AIGX-$VER-macos-x86_64" ;;
              aigx-macos-arm64)    out="AIGX-$VER-macos-arm64" ;;
              *) out="$name" ;;
            esac
            if [ -f "$dir/aigx" ]; then
              cp "$dir/aigx" "release-package/$out"
            elif [ -f "$dir/aigx.exe" ]; then
              cp "$dir/aigx.exe" "release-package/$out"
            fi
          done
          ls -la release-package/

      - name: Generate Release Notes
        id: release_notes
        run: |
          VER="${AIGX_VERSION}"
          cat > release-notes.md << ENDOFNOTES
          # AIGX Release ${VER}

          ## 📦 下载链接

          ### 二进制文件
          - [AIGX-${VER}-linux-amd64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/AIGX-${VER}-linux-amd64)
          - [AIGX-${VER}-linux-arm64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/AIGX-${VER}-linux-arm64)
          - [AIGX-${VER}-windows-amd64.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/AIGX-${VER}-windows-amd64.exe)
          - [AIGX-${VER}-macos-x86_64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/AIGX-${VER}-macos-x86_64)
          - [AIGX-${VER}-macos-arm64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/AIGX-${VER}-macos-arm64)

          ### 容器镜像

          \`\`\`
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          \`\`\`

          ## 🚀 安装说明

          ### Linux
          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AIGX-${VER}-linux-amd64
          chmod +x AIGX-${VER}-linux-amd64
          sudo mv AIGX-${VER}-linux-amd64 /usr/local/bin/aigx
          \`\`\`

          ### Windows
          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AIGX-${VER}-windows-amd64.exe" -OutFile "AIGX.exe"
          \`\`\`

          ## 🔧 构建系统

          - Rust 1.75+
          - Windows Server 2022
          - Debian 11 (Bookworm)
          - macOS latest

          ENDOFNOTES

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package release archives
        run: |
          cd release-package
          VER="${AIGX_VERSION}"
          for f in AIGX-$VER-linux-amd64 AIGX-$VER-linux-arm64 AIGX-$VER-macos-x86_64 AIGX-$VER-macos-arm64; do
            [ -f "$f" ] && tar -czf "$f.tar.gz" "$f"
          done
          [ -f AIGX-$VER-windows-amd64.exe ] && zip -q AIGX-$VER-windows-amd64.zip AIGX-$VER-windows-amd64.exe
          # 同时保留裸二进制（直接 wget 即用）
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-package/*
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
