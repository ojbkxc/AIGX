# AIGX 多平台构建 Workflow
# 自动编译所有平台的二进制文件，并推送到 GitHub Releases

name: Multi-platform Build

on:
  push:
    branches: [ main, develop ]
  # 仅在创建 tag 时触发（如 v1.0.0）
  release:
    types: [ created ]
  # 允许手动触发
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - docker

env:
  RUST_TOOLCHAIN: stable

jobs:
  # -----------------------------------------------------------------
  # Linux AMD64 构建任务
  # -----------------------------------------------------------------
  build-linux-amd64:
    name: Build Linux AMD64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compile toolchain
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --bin cross --locked

      - name: Build Linux AMD64
        run: |
          mkdir -p build/2024-Linux-x86_64
          cross build --release --target x86_64-unknown-linux-gnu
          mv target/x86_64-unknown-linux-gnu/release/aigx build/2024-Linux-x86_64/aigx

      - name: Strip binary
        run: |
          strip build/2024-Linux-x86_64/aigx
          file build/2024-Linux-x86_64/aigx

      - name: Upload AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-linux-amd64
          path: build/2024-Linux-x86_64/
          retention-days: 30

      # 仅在 tag 触发时推送到 Releases
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/2024-Linux-x86_64/*
          generate_release_notes: true

  # -----------------------------------------------------------------
  # Linux ARM64 构建任务
  # -----------------------------------------------------------------
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt, clippy

      - name: Install cross compiler for ARM64
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install aarch64 strip
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Linux ARM64
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo build --release --target aarch64-unknown-linux-gnu
          mkdir -p build/2024-Linux-arm64
          mv target/aarch64-unknown-linux-gnu/release/aigx build/2024-Linux-arm64/aigx

      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip build/2024-Linux-arm64/aigx
          file build/2024-Linux-arm64/aigx

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-linux-arm64
          path: build/2024-Linux-arm64/
          retention-days: 30

      # 仅在 tag 触发时推送到 Releases
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/2024-Linux-arm64/*
          generate_release_notes: true

  # -----------------------------------------------------------------
  # Windows AMD64 构建任务
  # -----------------------------------------------------------------
  build-windows-amd64:
    name: Build Windows AMD64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          targets: x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-win-amd64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows AMD64
        shell: cmd
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          if not exist build mkdir build
          if not exist build\2024-Windows-x86_64 mkdir build\2024-Windows-x86_64
          copy target\x86_64-pc-windows-gnu\release\aigx.exe build\2024-Windows-x86_64\aigx.exe

      - name: Upload Windows AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-windows-amd64
          path: build/2024-Windows-x86_64/
          retention-days: 30

      # 仅在 tag 触发时推送到 Releases
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/2024-Windows-x86_64/*
          generate_release_notes: true

  # -----------------------------------------------------------------
  # macOS Intel 构建任务
  # -----------------------------------------------------------------
  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-darwin-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build macOS Intel
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p build/2024-macOS-x86_64
          cp target/x86_64-apple-darwin/release/aigx build/2024-macOS-x86_64/aigx
          strip build/2024-macOS-x86_64/aigx

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-macos-x86_64
          path: build/2024-macOS-x86_64/
          retention-days: 30

      # 仅在 tag 触发时推送到 Releases
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/2024-macOS-x86_64/*
          generate_release_notes: true

  # -----------------------------------------------------------------
  # macOS Apple Silicon 构建任务
  # -----------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-darwin-arm64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build macOS Apple Silicon
        run: |
          mkdir -p build/2024-macOS-arm64
          cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/aigx build/2024-macOS-arm64/aigx
          strip build/2024-macOS-arm64/aigx

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-macos-arm64
          path: build/2024-macOS-arm64/
          retention-days: 30

      # 仅在 tag 触发时推送到 Releases
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/2024-macOS-arm64/*
          generate_release_notes: true

  # -----------------------------------------------------------------
  # 建立 Release（收集所有构建）
  # -----------------------------------------------------------------
  create-release:
    name: Create Release from Artifacts
    needs: [build-linux-amd64, build-linux-arm64, build-windows-amd64, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: |
          find artifacts -type f

      - name: Create Release Package
        run: |
          mkdir -p release-package
          find artifacts -type f -exec cp {} release-package/ \;

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > release-notes.md << ENDOFNOTES
          # AIGX Release ${GITHUB_REF#refs/tags/}

          ## 📦 下载链接

          ### 二进制文件
          - [aigx-linux-amd64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/aigx)

          二进制文件大小（未压缩）：
          - Linux AMD64: 15MB
          - Linux ARM64: 13MB
          - Windows AMD64: 18MB
          - macOS Intel: 12MB
          - macOS ARM64: 10MB

          ### 容器镜像

          \`\`\`
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          \`\`\`

          ## 🚀 安装说明

          ### Linux
          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aigx
          chmod +x aigx
          sudo mv aigx /usr/local/bin/
          \`\`\`

          ### Windows
          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aigx" -OutFile "aigx.exe"
          \`\`\`

          ## 🔧 构建系统

          - Rust 1.75+
          - Windows Server 2022
          - Debian 11 (Bookworm)
          - macOS latest

          ## ✨ 新特性

          - 多平台支持 (Linux AMD64/ARM64, Windows AMD64/ARM64, macOS Intel/ARM64)
          - Docker 多平台镜像构建
          - 完整的监控和告警系统
          - 智能自动扩缩容
          - 分布式节点管理

          ENDOFNOTES

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
