name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  APP_NAME: AIGX

jobs:
  # ============================================================
  # 获取版本号
  # ============================================================
  get-version:
    name: 获取版本号
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG_VERSION#v}
          echo "tag=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $TAG_VERSION ($VERSION)"

  # ============================================================
  # 构建前端
  # ============================================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 上传前端 artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: static/
          retention-days: 1

  # ============================================================
  # Linux 独立二进制 (amd64 + arm64, musl 静态链接)
  # ============================================================
  build-linux:
    name: 构建 Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    continue-on-error: true
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装 musl-tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
      - name: 构建 Rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: 打包
        run: |
          mkdir -p dist
          bin_name="${APP_NAME}-${VERSION}-linux-${{ matrix.arch }}"
          cp target/${{ matrix.target }}/release/aigx "dist/${bin_name}"
          cp -r static dist/static
          (cd dist && tar czf "../${bin_name}.tar.gz" "${bin_name}" static)
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: AIGX-${{ needs.get-version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ============================================================
  # Windows 独立二进制 (amd64)
  # ============================================================
  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    needs: [get-version, build-frontend]
    continue-on-error: true
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: 构建 Rust
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exeName = "$env:APP_NAME-$env:VERSION-windows-amd64.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/aigx.exe "dist/$exeName"
          Copy-Item -Recurse static dist/static
          Compress-Archive -Path "dist/$exeName", "dist/static" -DestinationPath "$env:APP_NAME-$env:VERSION-windows-amd64.zip"
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: AIGX-${{ needs.get-version.outputs.version }}-windows-amd64.zip
          retention-days: 1

  # ============================================================
  # macOS 独立二进制 (amd64 + arm64)
  # ============================================================
  build-macos:
    name: 构建 macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [get-version, build-frontend]
    continue-on-error: true
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
            runner: macos-latest
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载前端
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 构建 Rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: 打包
        run: |
          mkdir -p dist
          bin_name="${APP_NAME}-${VERSION}-darwin-${{ matrix.arch }}"
          cp target/${{ matrix.target }}/release/aigx "dist/${bin_name}"
          cp -r static dist/static
          (cd dist && tar czf "../${bin_name}.tar.gz" "${bin_name}" static)
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ matrix.arch }}
          path: AIGX-${{ needs.get-version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ============================================================
  # Docker 多架构构建并推送
  # ============================================================
  build-docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [get-version, build-frontend]
    continue-on-error: true
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_IMAGE || 'aigx/aigx' }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: 登录 DockerHub
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DOCKER_USERNAME != '' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 创建 GitHub Release
  # ============================================================
  create-release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [get-version, build-linux, build-windows, build-macos]
    if: (!cancelled())
    env:
      TAG: ${{ needs.get-version.outputs.tag }}
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
        continue-on-error: true
      - name: 列出产物
        run: |
          echo "=== 可用产物 ==="
          find dist -type f 2>/dev/null | sort || echo "  (无产物)"
      - name: 收集产物文件
        id: collect
        run: |
          cp docker-compose.yml dist/docker-compose.yml 2>/dev/null || true
          {
            echo "files<<EOF"
            find dist -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "docker-compose.yml" \) 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 创建 Release
        if: steps.collect.outputs.files != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: AIGX ${{ needs.get-version.outputs.tag }}
          body: |
            ## AIGX ${{ needs.get-version.outputs.version }}

            Rust 实现的 AI 中转网关，同时支持 OpenAI 与 Anthropic 兼容格式，多账号 Cloudflare Workers AI + 易支付 + 多用户配额。

            ### 产物
            - **Linux**: `AIGX-${{ needs.get-version.outputs.version }}-linux-amd64.tar.gz` / `AIGX-${{ needs.get-version.outputs.version }}-linux-arm64.tar.gz`
            - **Windows**: `AIGX-${{ needs.get-version.outputs.version }}-windows-amd64.zip`
            - **macOS**: `AIGX-${{ needs.get-version.outputs.version }}-darwin-amd64.tar.gz` / `AIGX-${{ needs.get-version.outputs.version }}-darwin-arm64.tar.gz`
            - **Docker**: `docker-compose.yml`

            ### 使用
            - **Linux/macOS**: `tar xzf` 解压后运行 `./AIGX-*`
            - **Windows**: 解压后运行 `AIGX-${{ needs.get-version.outputs.version }}-windows-amd64.exe`
            - **Docker**: `docker-compose up -d`
            - 默认监听 `127.0.0.1:8080`，首次用邮箱 `admin@aigx.local` 登录并设置密码

            ### API 端点
            ```
            POST /v1/chat/completions  (OpenAI 兼容)
            POST /v1/messages           (Anthropic 兼容)
            POST /v1/embeddings
            POST /v1/audio/transcriptions
            GET  /v1/models
            ```
          files: ${{ steps.collect.outputs.files }}
          draft: false
          prerelease: false
