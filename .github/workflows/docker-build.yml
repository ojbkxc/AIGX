# AIGX Docker 多平台构建 Workflow
# 自动构建和推送多平台 Docker 镜像到 GitHub Container Registry

name: Docker Multi-platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to Registry'
        required: true
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------------
  # Docker 构建和推送 (多平台)
  # -----------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  # -----------------------------------------------------------------
  # 验证多平台镜像
  # -----------------------------------------------------------------
  verify-multiarch:
    name: Verify Multi-platform Images
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Check multi-platform availability
        id: check-manifest
        run: |
          # 检查 Docker 镜像清单
          MANIFEST=$(docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>&1)
          if echo "$MANIFEST" | grep -q '"architecture"'; then
            echo "✓ Multi-platform image verified"
            echo "platforms<<EOF" >> $GITHUB_OUTPUT
            echo "$MANIFEST" | jq -r '.manifests[].platform.architecture // .architecture' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "✗ Multi-platform image not found"
            exit 1
          fi

      - name: Display supported architectures
        run: |
          echo "Supported architectures:"
          echo ${{ steps.check-manifest.outputs.platforms }}

  # -----------------------------------------------------------------
  # 安装包构建
  # -----------------------------------------------------------------
  build-packages:
    name: Build Install Packages
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            python3 \
            python3-pip

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release packages
        run: |
          mkdir -p releases
          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              platform=$(basename "$dir")
              cd "$dir"
              if [ -f "aigx" ] || [ -f "aigx.exe" ]; then
                if [[ "$OSTYPE" == "linux-gnu"* ]]; then
                  tar -czvf ../releases/aigx-${platform}.tar.gz $(ls * | head -n 1)
                else
                  cd ..
                  echo "Windows/Other platform packages created"
                fi
              fi
            fi
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: install-packages
          path: releases/
          retention-days: 30