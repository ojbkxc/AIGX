name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          echo "Frontend built"

      - name: Verify frontend output
        run: |
          test -f static/index.html
          echo "Frontend output verified: static/index.html"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust server (host target)
        run: cargo build --release 2>&1

      - name: Verify build artifact
        run: |
          if [ ! -f "target/release/aigx" ]; then
            echo "::error::Rust binary not found"
            exit 1
          fi
          echo "Rust binary built: target/release/aigx"
