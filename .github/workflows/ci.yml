name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (default features)
        # --workspace：aigx-net 是 workspace 成员，裸 --all-targets 只检查
        # 默认包，成员里的 clippy 错误会一路积压到没人看见。
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      # lint / 单测 / 类型检查先于构建：构建能过不代表代码合规，
      # 也不代表 hook 依赖、i18n key、SSE 解析这些纯逻辑没退化。
      - name: Lint (eslint, max-warnings 0)
        working-directory: frontend
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run
      - name: i18n key consistency check
        # 防回归：t() 字面量 key 必须在 zh/en 都存在，否则英文界面回退中文
        working-directory: frontend
        run: npm run i18n:check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify frontend output
        run: |
          test -f static/index.html
          echo "Frontend output verified: static/index.html"
      # static/ 是入库的构建产物（发布直接用）。若源码改了但没重新构建提交，
      # 线上静态文件会与源码不一致。这里在构建后比对，发现漂移即失败。
      - name: Verify static/ matches source
        run: |
          if [ -n "$(git status --porcelain static)" ]; then
            echo "::error::static/ 与前端源码不一致，请在 frontend 目录执行 npm run build 并提交产物"
            git status --porcelain static | head -40
            exit 1
          fi
          echo "static/ up to date"
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-static
          path: static/
          retention-days: 7

  # E2E 跑在刚构建出的 static/ 上，用内置静态服务器 + API 桩，
  # 不需要后端与数据库。放在独立 job：浏览器下载较重，且失败原因与前端的
  # lint/typecheck 不同，分开更易定位。
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # E2E 断言的是入库的构建产物，先确保 static/ 与源码一致地重建一遍
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  rust-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # 每个 feature 组合都是独立产品面：SeaORM(PostgreSQL/MySQL) 后端
      # 编译失败不代表默认后端有问题，反之亦然，互不取消。
      fail-fast: false
      matrix:
        include:
          - name: check (default / sqlite-kv)
            args: ""
          - name: check (no-default-features / JSON FileStore)
            args: "--no-default-features"
          - name: check (sea-orm + postgres)
            args: "--no-default-features --features sea-orm,postgres"
          - name: check (sea-orm + mysql)
            args: "--no-default-features --features sea-orm,mysql"
          # 发布产物专用的 feature 组合：多平台构建 workflow 与 Dockerfile
          # 都用 `--features "sqlite-kv,postgres"`（rusqlite KV + PG 双后端），
          # 它既不是默认组合也不是上面任何一项。v1.0.31 就是在这个组合上
          # 首次编译才发现 `put_async` 的 match 非穷举，导致 Linux 两平台
          # 构建失败、Release 只出了 5 个资产。发版组合必须在 PR 阶段就编译。
          - name: check (release / sqlite-kv+postgres)
            args: "--features \"sqlite-kv,postgres\""
          # 全特性组合：新增 feature 时忘记加 cfg 门控，这里最先暴露。
          - name: check (all features)
            args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: ${{ matrix.name }}
        run: cargo check ${{ matrix.args }} --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked
      - name: Verify release build
        run: cargo build --release --locked

  # 上游能力漂移巡检：Agent2API 加了新的签到家 / 模型目录家 / 改了目录端点，
  # AIGX 没跟上时这里会红。
  #
  # 这类漂移**不会**让 AIGX 报错 —— provider id 还在、账号也能加，只是
  # 「点同步模型说不支持」「签到中心里没有这家」。不主动巡检就发现不了，
  # 等用户报「A2A 有 AIGX 没有」时已经隔了若干个版本。
  #
  # 巡检只比对标识符与端点常量（不拷贝上游实现代码）。拉不到上游时**跳过**
  # 而不是失败 —— 网络抖动不该把 CI 弄红。
  upstream-drift:
    name: upstream drift (Agent2API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Checkout upstream Agent2API
        continue-on-error: true
        id: upstream
        uses: actions/checkout@v4
        with:
          repository: aimod-cc/Agent2API
          path: upstream-agent2api
          ref: main
      - name: Provider capability drift check
        if: steps.upstream.outcome == 'success'
        run: |
          set +e
          python tools/sync_agent2api_providers.py --upstream upstream-agent2api --check
          rc_data=$?
          python tools/sync_agent2api_capabilities.py --upstream upstream-agent2api --check
          rc_cap=$?
          python tools/sync_agent2api_credential_fields.py --upstream upstream-agent2api --check
          rc_fields=$?
          if [ $rc_data -ne 0 ] || [ $rc_cap -ne 0 ] || [ $rc_fields -ne 0 ]; then
            echo "::error::Agent2API 上游有 AIGX 尚未跟上的 provider 能力（数据层、能力层或凭证字段模板）。"
            echo "::error::数据层=provider id/展示名；能力层=签到名单/模型目录/目录端点；字段模板=账号记录的具名凭证字段。"
            echo "::error::字段模板可用 tools/sync_agent2api_credential_fields.py --write 半自动对齐；其余按 docs/agent2api-porting.md 的契约逐家移植后重跑本 job。"
            exit 1
          fi
          echo "upstream drift check passed: provider / capability / credential-field 均与上游一致"
      - name: Note drift detection skipped
        if: steps.upstream.outcome != 'success'
        run: echo "::warning::上游 Agent2API 拉取失败，本次漂移巡检跳过（网络问题，不阻断 CI，但漂移不会被检出）"
