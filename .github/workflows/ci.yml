name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  DOCKER_IMAGE: ojbkxc/aigx

jobs:
  # ============================================================
  # 前端构建
  # ============================================================
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: static/
          retention-days: 1

  # ============================================================
  # Rust 后端构建（多平台）
  # ============================================================
  backend:
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux aarch64)
        if: matrix.use_cross
        run: cargo install cross

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: !matrix.use_cross
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy frontend (Linux/macOS)
        if: runner.os != 'Windows'
        run: cp -r static/ target/${{ matrix.target }}/release/static/

      - name: Copy frontend (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "target/${{ matrix.target }}/release/") {
            Copy-Item -Recurse -Force static\* "target/${{ matrix.target }}/release\static\"
          }

      - name: Package binary
        shell: bash
        run: |
          BIN_NAME="AIGX-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${BIN_NAME}.zip" ./target/${{ matrix.target }}/release/aigx.exe ./target/${{ matrix.target }}/release/static/
          else
            tar czf "${BIN_NAME}.tar.gz" -C ./target/${{ matrix.target }}/release aigx static/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AIGX-${{ matrix.target }}
          path: AIGX-${{ matrix.target }}.*
          retention-days: 1

  # ============================================================
  # Docker 构建（非阻塞，失败不影响整体 CI）
  # ============================================================
  docker:
    needs: [frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Login to DockerHub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DOCKER_USERNAME != '' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # GitHub Release
  # ============================================================
  release:
    needs: [backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: AIGX-*
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
