# AIGX CI 工作流 - 基础的持续集成检查

name: CI - Basic Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ci-basic:
    name: Basic CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if .github/workflows exist
        run: |
          if [ -d ".github/workflows" ]; then
            echo "✓ .github/workflows 不存在，需要创建"
            exit 1
          else
            echo "✓ .github/workflows 目录存在"
            ls -la .github/workflows/
          fi

      - name: Verify workflow files
        run: |
          echo "检查工作流文件..."
          for file in .github/workflows/*.yml; do
            echo "  - $file"
            if [ ! -s "$file" ]; then
              echo "  ⚠️  文件为空"
            fi
          done

      # Rust 版本检查
      - name: Check Rust version
        run: |
          if command -v rustc &> /dev/null; then
            rustc --version
            cargo --version
          else
            echo "Rust 未安装，将从 workflow 中构建"
          fi

      - name: Check project structure
        run: |
          echo "项目结构检查..."
          ls -la
          echo ""
          echo "源文件:"
          find . -type f -name "*.rs" 2>/dev/null | head -10
          echo ""
          echo "前端文件:"
          find frontend -type f -name "*.jsx" 2>/dev/null | head -10