name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      # lint / 单测 / 类型检查先于构建：构建能过不代表代码合规，
      # 也不代表 hook 依赖、i18n key、SSE 解析这些纯逻辑没退化。
      - name: Lint (eslint, max-warnings 0)
        working-directory: frontend
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify frontend output
        run: |
          test -f static/index.html
          echo "Frontend output verified: static/index.html"
      # static/ 是入库的构建产物（发布直接用）。若源码改了但没重新构建提交，
      # 线上静态文件会与源码不一致。这里在构建后比对，发现漂移即失败。
      - name: Verify static/ matches source
        run: |
          if [ -n "$(git status --porcelain static)" ]; then
            echo "::error::static/ 与前端源码不一致，请在 frontend 目录执行 npm run build 并提交产物"
            git status --porcelain static | head -40
            exit 1
          fi
          echo "static/ up to date"
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: aigx-static
          path: static/
          retention-days: 7

  rust-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # 每个 feature 组合都是独立产品面：SeaORM(PostgreSQL/MySQL) 后端
      # 编译失败不代表默认后端有问题，反之亦然，互不取消。
      fail-fast: false
      matrix:
        include:
          - name: check (default / sqlite-kv)
            args: ""
          - name: check (no-default-features / JSON FileStore)
            args: "--no-default-features"
          - name: check (sea-orm + postgres)
            args: "--no-default-features --features sea-orm,postgres"
          - name: check (sea-orm + mysql)
            args: "--no-default-features --features sea-orm,mysql"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: ${{ matrix.name }}
        run: cargo check ${{ matrix.args }}

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Verify release build
        run: cargo build --release
