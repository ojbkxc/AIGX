name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 依赖漏洞扫描：cargo-audit 对照 RustSec advisory DB 检查 Cargo.lock
  # 里的全部依赖（含传递依赖）。这是依赖面唯一的主动防线——只管「升级到新版本」
  # 的自动 PR 覆盖不到「现有版本有没有已知漏洞」，故由本 job 承担。
  # 默认策略：高危/严重漏洞即红；豁免必须走下方显式 --ignore + 注释理由。
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # 显式豁免清单（#24 波次落地后 2026-11-15 更新）：
        # reqwest 0.13.5 → hickory 0.26.3（解 14 条）；sea-orm 2.0 → rsa 出树
        # （解 1 条）。原 22 条移除 15 条，余 7 条豁免如下。组1–3 为父依赖
        # 约束卡死，组4 为手工解压绕过。
        run: |
          ignores=(
            # 组1 ×1：libsqlite3-sys 0.37 修复线 0.39 需 rusqlite 0.41，
            #   但 rusqlite 0.41 的 libsqlite3-sys 0.39 与 sea-orm 2.0 的
            #   sqlx-sqlite 0.9（要求 libsqlite3-sys <0.38）links 冲突，
            #   rusqlite 锁 0.39 保 libsqlite3-sys 0.37 兼容
            RUSTSEC-2026-0459
            # 组2 ×1：crypto-bigint 0.5.5（经 elliptic-curve/p256 引入，
            #   非 sqlx 链——rsa 已随 sea-orm 2.0 出树），修复线 0.7.6
            #   需 elliptic-curve 大版本升级
            RUSTSEC-2026-0387
            # 组3 ×4：zip 2.6.1 恒久豁免——4 条触发路径全在 ZipArchive::
            #   extract 等便捷 API；本仓 plugin_host/install.rs 手工逐条
            #   解压（by_index + safe_join 防 zip-slip），从不调用漏洞 API
            #   （4 条修复线均 >= 9.0.0，升级跨 7 个大版本，本窗口不升）
            RUSTSEC-2026-0429 RUSTSEC-2026-0367 RUSTSEC-2026-0369
            RUSTSEC-2026-0368
            # 组3b ×2（2026-11-18 新增，同为 zip 2.6.1）：
            #   -0548 ZipStreamReader 用本地头文件名与中央目录不一致 ——
            #     本仓从不使用 ZipStreamReader（只用 ZipArchive::by_index
            #     读中央目录名，且 safe_join 再兜一道）
            #   -0545 AES 条目未校验证书 —— 本仓 zip 关闭默认 feature
            #     （default-features=false, features=["deflate"]），
            #     无 aes-crypto，AES 解密路径根本不参与编译
            RUSTSEC-2026-0548 RUSTSEC-2026-0545
            # 组4 ×1：unsafe-libyaml（serde_yaml_ng 0.10 传递依赖，仍
            #   unmaintained）；唯一使用点 proxy_pool/clash.rs 仅 Value+
            #   from_str 纯数据反序列化，迁移超本窗口
            RUSTSEC-2024-0449
            # 组5 ×5（2026-11-19 新增，wasmtime 36.0.20，均为 2026-11-16
            #   发布的 advisory-db 新公告，非本仓代码引入）。本仓 wasmtime
            #   仅用于受控 wasm 插件运行时（只加载运维自下载的受信插件，
            #   不跑不可信 wasm），且逐条触达分析均不成立：
            #   -0566 wasi AsyncWriteStream 空写内存增长 —— 未启用 wasi
            #     feature，该代码不参与编译
            #   -0571 wasi-http 空 Body 无界堆 —— 未启用 wasi-http feature
            #   -0573 GC heap 页大小 abort —— 未启用 gc feature
            #   -0569 Caller::get_module_export panic —— 全仓 0 处调用该 API
            #   -0567 无 threads feature 构建 abort —— 36.x 线无补丁
            #     （patched 仅 >=48.0.9，跨 12 大版本不可行）；需特定
            #     wasm 模块触发，受控插件场景不成立
            RUSTSEC-2026-0566 RUSTSEC-2026-0567 RUSTSEC-2026-0569
            RUSTSEC-2026-0571 RUSTSEC-2026-0573
          )
          args=()
          for i in "${ignores[@]}"; do args+=(--ignore "$i"); done
          cargo audit "${args[@]}"

  route-inventory:
    name: route inventory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # 双向硬断言（见 tools/extract_routes.py 模块 docstring）：
      #   真实路由 ⊆ 文档 ∪ 豁免   （新路由未登记且未豁免 → 红）
      #   文档 ⊆ 真实路由           （文档虚构了不存在的路由 → 红）
      #   工具 covers ⊆ 真实路由     （#35 批3 B3-1：工具声明的覆盖不得指向
      #                              已删/从未存在的路由 → 幽灵 covers 红）
      # 补上单测 covers_all_real_admin_routes 管不到的那一段：单测只保证
      # 「文档 ↔ real_admin_routes() 清单」相等，管不到「清单 ↔ main.rs 真实
      # 路由」；两边一起漏登时断言仍绿，本闸门静态提取真实路由来兜底。
      # 同理 covers ⊆ 真实路由 原先只有单测 tool_covers_point_at_real_routes
      # 在盯，跳过 cargo test 就没人管（批1 的 /api/keys 幽灵即如此）。
      - name: "Gate: admin routes documented or explicitly exempt"
        run: python tools/extract_routes.py .

  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      # lint / 单测 / 类型检查先于构建：构建能过不代表代码合规，
      # 也不代表 hook 依赖、i18n key、SSE 解析这些纯逻辑没退化。
      - name: Lint (eslint, max-warnings 0)
        working-directory: frontend
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run
      - name: i18n key consistency check
        # 防回归：t() 字面量 key 必须在 zh/en 都存在，否则英文界面回退中文
        working-directory: frontend
        run: npm run i18n:check
      - name: i18n interpolation shape check
        # 防回归（#45/#56）：键侧 {{x}} 但值侧 {x} 时 i18next 不插值、
        # 界面渲染字面量 {n}——key consistency 查不出这种形态漂移。
        # 动态拼接/文档占位体系键（{base} 等）在脚本白名单豁免。
        working-directory: frontend
        run: node scripts/i18n-interpolation-check.mjs
      - name: Build frontend
        id: build
        working-directory: frontend
        run: npm run build
      - name: Verify frontend output
        run: |
          test -f static/index.html
          echo "Frontend output verified: static/index.html"
      # static/ 是入库的构建产物（发布直接用）。若源码改了但没重新构建提交，
      # 线上静态文件会与源码不一致。这里在构建后比对，发现漂移即失败。
      - name: Verify static/ matches source
        run: |
          if [ -n "$(git status --porcelain static)" ]; then
            echo "::error::static/ 与前端源码不一致，请在 frontend 目录执行 npm run build 并提交产物"
            git status --porcelain static | head -40
            exit 1
          fi
          echo "static/ up to date"
      # 即便上面那条「static 漂移」失败也把本次构建产物传出来：
      # 本步骤的比对就是拿这次构建跟入库的 static/ 比，所以它的输出是 static/ 的
      # 权威来源。本地没有构建条件（磁盘吃紧/无非本机构建环境）时，直接取这个
      # 产物回填 static/ 再提交，比对必然通过。
      # 条件限定为「构建本身成功」——tsc/eslint 挂掉时不该产出可被误当成有效产物的包。
      - name: Upload frontend artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aigx-static
          path: static/
          retention-days: 7

  # E2E 跑在刚构建出的 static/ 上，用内置静态服务器 + API 桩，
  # 不需要后端与数据库。放在独立 job：浏览器下载较重，且失败原因与前端的
  # lint/typecheck 不同，分开更易定位。
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # E2E 断言的是入库的构建产物，先确保 static/ 与源码一致地重建一遍
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  rust-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # 每个 feature 组合都是独立产品面：SeaORM(PostgreSQL/MySQL) 后端
      # 编译失败不代表默认后端有问题，反之亦然，互不取消。
      fail-fast: false
      matrix:
        include:
          - name: check (default / sqlite-kv)
            args: ""
          - name: check (no-default-features / JSON FileStore)
            args: "--no-default-features"
          - name: check (sea-orm + postgres)
            args: "--no-default-features --features sea-orm,postgres"
          - name: check (sea-orm + mysql)
            args: "--no-default-features --features sea-orm,mysql"
          # 发布产物专用的 feature 组合：多平台构建 workflow 与 Dockerfile
          # 都用 `--features "sqlite-kv,postgres"`（rusqlite KV + PG 双后端），
          # 它既不是默认组合也不是上面任何一项。v1.0.31 就是在这个组合上
          # 首次编译才发现 `put_async` 的 match 非穷举，导致 Linux 两平台
          # 构建失败、Release 只出了 5 个资产。发版组合必须在 PR 阶段就编译。
          - name: check (release / sqlite-kv+postgres)
            args: "--features \"sqlite-kv,postgres\""
          # 全特性组合：新增 feature 时忘记加 cfg 门控，这里最先暴露。
          - name: check (all features)
            args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: ${{ matrix.name }}
        run: cargo check ${{ matrix.args }} --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 时区固定为 UTC：`tz_migrate_zero_to_eight_rewrites_old_keys` 断言
      # 「20:00Z 在 +8 归次日」（old_b==new_a）依赖系统本地口径 = UTC
      # （`report_tz_of(0)` 读 `Local::now().offset()`）。runner 默认虽是 UTC，
      # 显式固定消除「runner 时区漂移导致假红」的隐患（本地 UTC+8 机器必红）。
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked
      - name: Verify release build
        run: cargo build --release --locked

  # 上游能力漂移巡检：Agent2API 加了新的签到家 / 模型目录家 / 改了目录端点，
  # AIGX 没跟上时这里会红。
  #
  # 这类漂移**不会**让 AIGX 报错 —— provider id 还在、账号也能加，只是
  # 「点同步模型说不支持」「签到中心里没有这家」。不主动巡检就发现不了，
  # 等用户报「A2A 有 AIGX 没有」时已经隔了若干个版本。
  #
  # 巡检只比对标识符与端点常量（不拷贝上游实现代码）。拉不到上游时**跳过**
  # 而不是失败 —— 网络抖动不该把 CI 弄红。
  upstream-drift:
    name: upstream drift (Agent2API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Checkout upstream Agent2API
        continue-on-error: true
        id: upstream
        uses: actions/checkout@v4
        with:
          repository: aimod-cc/Agent2API
          path: upstream-agent2api
          ref: main
      - name: Provider capability drift check
        if: steps.upstream.outcome == 'success'
        run: |
          set +e
          python tools/sync_agent2api_providers.py --upstream upstream-agent2api --check
          rc_data=$?
          python tools/sync_agent2api_capabilities.py --upstream upstream-agent2api --check
          rc_cap=$?
          python tools/sync_agent2api_credential_fields.py --upstream upstream-agent2api --check
          rc_fields=$?
          if [ $rc_data -ne 0 ] || [ $rc_cap -ne 0 ] || [ $rc_fields -ne 0 ]; then
            echo "::error::Agent2API 上游有 AIGX 尚未跟上的 provider 能力（数据层、能力层或凭证字段模板）。"
            echo "::error::数据层=provider id/展示名；能力层=签到名单/模型目录/目录端点；字段模板=账号记录的具名凭证字段。"
            echo "::error::字段模板可用 tools/sync_agent2api_credential_fields.py --write 半自动对齐；其余按 docs/agent2api-porting.md 的契约逐家移植后重跑本 job。"
            exit 1
          fi
          echo "upstream drift check passed: provider / capability / credential-field 均与上游一致"
      - name: Note drift detection skipped
        if: steps.upstream.outcome != 'success'
        run: echo "::warning::上游 Agent2API 拉取失败，本次漂移巡检跳过（网络问题，不阻断 CI，但漂移不会被检出）"
