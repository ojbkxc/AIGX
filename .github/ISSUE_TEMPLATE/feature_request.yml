name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明「你要解决的问题」，而不只是「你想要的功能」——这样更容易找到更合适的做法。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不方便 / 缺什么能力？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的设想
      description: 期望的用法或界面（如有参考实现可贴链接）
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
    validations:
      required: false
