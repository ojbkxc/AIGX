[package]
name = "aigx-net"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["AIGX Team"]
description = "AIGX Network Layer - Professional Network Connection Management"
repository = "https://github.com/aigx-io/aigx"

[dependencies]
# 基础库
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 网络相关
socket2 = "0.5"
reqwest = { version = "0.12", features = ["json"] }
hyper = "1.5"
tower = "0.5"

# 网络协议
socket2 = "0.5"
h2 = "0.4"
rustls-native-certs = "0.8"
rustls = "0.23"

# 连接池
deadpool-rt = "0.16"

# 序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
log = "0.4"

# 配置管理
config = { version = "0.14", features = ["toml"] }
dotenv = "0.15"

# 持久化
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
redis = { version = "0.27", features = ["tokio-rustls"] }

# 指标与监控
lazy_static = "1.5"
prometheus = "0.13"
metrics = "0.24"

# 分布式
crossbeam = "0.8"
dashmap = "6.1"

# 工具工具
rand = "0.9"
bs58 = "0.5"
async-lock = "3.3"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["full"]
full = [
    "proactive-locking",
    "prometheus-export",
    "distributed-mode",
    "auto-scaling",
    "monitoring",
    "tracing-full",
]

proactive-locking = []
prometheus-export = ["dep:prometheus"]
distributed-mode = []
auto-scaling = []
monitoring = []
tracing-full = []