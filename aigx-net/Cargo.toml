[package]
name = "aigx-net"
version = "1.0.0"
edition = "2021"
authors = ["AIGX Team"]
description = "AIGX Network Layer - Professional Network Connection Management"
license = "MIT"

[features]
default = []
# 分布式模式（Phase 4，默认关闭以保持轻量）
distributed-mode = []
# 监控导出（Phase 4）
monitoring = []
# 自动扩缩容（Phase 4）
auto-scaling = []

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
