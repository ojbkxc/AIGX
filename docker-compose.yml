version: "3.8"

services:
  aigx:
    build: .
    container_name: aigx
    restart: unless-stopped
    # 以非 root 用户（uid:gid = 10001:10001）运行，与 Dockerfile 中
    # 的 USER aigx 一致，双重保险防止提权。
    user: "10001:10001"
    ports:
      - "8080:8080"
    volumes:
      # 数据目录挂载到 /data（非 root 用户可写，与 Dockerfile VOLUME 对齐）
      - aigx-data:/data

volumes:
  aigx-data:
