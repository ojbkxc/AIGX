# ── Workspace ────────────────────────────────────────────────────────
[workspace]
members = ["."]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[package]
name = "aigx"
version = "1.0.107"
description = "AIGX — OpenAI-compatible AI gateway with multi-account Cloudflare Workers AI and Epay support"
edition = "2021"
license-file = "LICENSE"

# ── Feature flags ────────────────────────────────────────────────────
# 多数据库支持：默认使用 FileStore + rusqlite KV 存储，零配置零依赖。
# 启用 sea-orm 后可通过 [database] url 切换 PostgreSQL/MySQL 后端。
#
# 注意：rusqlite 0.39（libsqlite3-sys 0.37）与 sea-orm 2.0 的 sqlx-sqlite 0.9
# （libsqlite3-sys 0.37）原生库版本一致，无 links 冲突。但 AIGX 仍不提供
# sea-orm 的 sqlite 驱动——SQLite 场景已由默认的 FileStore/rusqlite 覆盖，
# SeaORM 后端仅支持 PostgreSQL/MySQL（rusqlite 0.41 的 libsqlite3-sys 0.39
# 会与 sqlx-sqlite 0.9 的 <0.38 约束冲突，故 rusqlite 锁 0.39）。
#
# 用法示例：
# - 默认构建（FileStore + rusqlite）：cargo build
# - PostgreSQL 后端：cargo build --no-default-features --features "sea-orm,postgres"
# - MySQL 后端：cargo build --no-default-features --features "sea-orm,mysql"
[features]
default = ["sqlite-kv"]
# rusqlite KV 存储（SqliteStore）— 默认启用，提供 SQLite KV 后端
sqlite-kv = ["dep:rusqlite"]
# 启用 SeaORM 后端（与 FileStore 共存，由 config.database.url 决定实际使用哪个）
sea-orm = ["dep:sea-orm", "dep:sea-orm-migration"]
# SeaORM PostgreSQL 驱动
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
# SeaORM MySQL 驱动
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]

[dependencies]
# HTTP
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { workspace = true }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip"] }
# socks：账号型渠道的出口代理需要 socks5://（reqwest 0.12/0.13 的 socks feature 均为空特性，
# 代理实现已由 hyper-util 的 client-proxy 承担，不新增依赖、不改 Cargo.lock）
# form/query：reqwest 0.13 起这两个 RequestBuilder 方法变为默认关闭的 feature，
# AIGX 大量使用 .form()（account_login/payment/checkin/oauth 等）与 .query()（payment），必须显式启用。
# rustls-no-provider：reqwest 0.13 无 rustls-ring feature（只有 rustls 默认捆绑 aws-lc-rs），
# 选 rustls-no-provider + 启动时手动 install_default(ring)，避开 aws-lc-rs 的 cmake 编译与
# CI ARM/musl 风险，并与现有 tokio-rustls 0.26 ring 栈统一为单一 crypto provider。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "form", "query", "rustls-no-provider", "socks", "hickory-dns"] }
# SMTP STARTTLS（批次7c）：tokio-rustls 包装 TcpStream 升级 TLS。
# 版本与 reqwest rustls 栈对齐（reqwest 0.13 用 rustls 0.23 / tokio-rustls 0.26）。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
# reqwest rustls-no-provider 不捆绑 crypto provider：程序启动时手动安装 ring
# （见 main.rs install_default），显式声明以固定版本与特性。
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
# ring 直接依赖：插件包 ed25519 验签（ring::signature::ED25519，与 rustls 同一份 ring）。
ring = "0.17"
# url crate — reqwest 的传递依赖，显式声明用于 form_urlencoded 构造 submit.php 回退 query string
url = "2"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Clash Verge 配置读取（proxy-pool sync-clash 解析 verge.yaml）
serde_yaml_ng = "0.10"

# Crypto
sha2 = "0.10"
# 凭证加密：AES-256-GCM（与 Agent2API 的 crypto.rs 同算法同信封格式）
aes-gcm = "0.10"
# 系统熵源（密钥与 nonce 的随机来源）
getrandom = "0.2"
sha1 = "0.10"
hmac = "0.12"
# TRAE 登录要求每次现生成一台设备的 EC P-256 公钥（SPKI PEM）
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
hex = "0.4"
md5 = "0.7"
# MonkeyCode 任务流是 WebSocket（ACP 事件），需要 TLS 版客户端
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { workspace = true }
argon2 = "0.5"

# Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# Config
toml = "0.8"
dirs = "5"

# Error handling
anyhow = "1"

# Utilities
rand = "0.8"
parking_lot = "0.12"
base64 = "0.22"
mime_guess = "2"
thiserror = "1"
arc-swap = "1"
dashmap = "6"
futures = "0.3"
tokio-stream = "0.1"
# 插件宿主：解压插件包（zip），并做 zip-slip 防护
zip = { version = "2", default-features = false, features = ["deflate"] }
# Wasm 插件沙箱：与 Agent2API v3.5.0-beta.1 同版本同特性集
# （cranelift JIT + async + 仅 runtime/std，不带 wasi/wat 等额外面）。
wasmtime = { version = "36.0.21", default-features = false, features = ["async", "cranelift", "runtime", "std"] }

# Async
async-trait = "0.1"

# Database (SQLite via rusqlite with bundled SQLite)
# rusqlite KV 存储（SqliteStore）— 可选后端，通过 sqlite-kv feature 启用（默认启用）。
#
# 注意：rusqlite（libsqlite3-sys 0.39）与 sea-orm 的 sqlx-sqlite（libsqlite3-sys 0.26）
# 存在原生库 links 冲突。当启用 sea-orm + sqlite 时需用 --no-default-features 禁用 sqlite-kv。
# FileStore（storage/mod.rs）不依赖 rusqlite，始终可用。
rusqlite = { version = "0.39", features = ["bundled"], optional = true }

# SeaORM 2.0 — 多数据库 ORM（PostgreSQL/MySQL），可选后端。
# 仅当启用 `sea-orm` feature 时编译；通过 `postgres`/`mysql` feature 选择驱动。
#
# 2.0 breaking 要点：DatabaseConnection enum→struct（.inner 访问，新枚举 DatabaseConnectionType）；
# execute/query_all/query_one 改收 SeaQuery 语句（原始 SQL 用 execute_raw/query_all_raw）；
# DeleteOne/UpdateOne 需 .validate()?；移除 DeriveCustomColumn/default_as_str。
# AIGX 只用 DeriveEntityModel + DeriveRelation + Database::connect + MigratorTrait，
# 不使用 sea-orm query builder，适配面极小。
#
# 使用 default-features = false 避免默认引入 sqlx-sqlite（与 rusqlite 的 libsqlite3-sys 产生 links 冲突）。
# 驱动通过本 crate 的 postgres/mysql feature 显式启用。
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "macros"], optional = true }
sea-orm-migration = { version = "2.0.2", default-features = false, features = ["runtime-tokio-rustls"], optional = true }

# Token estimation (BPE-based, same as aisix)
tiktoken-rs = "0.12"


# Regex for keyword guardrail
regex = "1"

# CSV 解析（公开提示词源 prompts.chat 的 prompts.csv）
csv = "1"
toml_edit = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
# 测试用时间冻结（cron 调度器的时间推进测试）
tokio = { workspace = true, features = ["full", "test-util"] }

# ── #34 断线 499 计费 CI 回归（方案 B）──────────────────────────────
# cargo 自动发现只认 tests/*.rs 与 tests/*/main.rs，tests/e2e/ 下的
# .rs 不会自动成为测试目标，故显式声明。该测试起真实二进制 + 双协议
# mock 上游，断言 Drop→499→估算计费→无双计全链（含 anthropic 面镜像）。
[[test]]
name = "499_disconnect_billing"
path = "tests/e2e/499_disconnect_billing.rs"

# ── Release 构建加固 ────────────────────────────────────────────────
# LTO：跨 crate 死代码消除 + 内联，减小体积并抹掉部分符号信息面。
# 用 thin 而非 fat：体积/安全收益接近，但链接内存与耗时远低于 fat，
# 在 CI 多平台矩阵 + postgres 原生依赖下更稳。
# strip=true：让 rustc 在链接后直接剥离符号（等价外部 strip，但跨平台
# 一致，不依赖 CI runner 上的 binutils 与交叉 strip 工具）。
[profile.release]
lto = "thin"
strip = true
codegen-units = 1
