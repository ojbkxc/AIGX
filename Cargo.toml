[package]
name = "aigx"
version = "0.1.0"
description = "AIGX — OpenAI-compatible AI gateway with multi-account Cloudflare Workers AI and Epay support"
edition = "2021"
license = "MIT"

[dependencies]
# HTTP
axum = { version = "0.7", features = ["macros"] }
axum-extra = "0.9"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Config
toml = "0.8"
dirs = "5"

# Error handling
anyhow = "1"

# Utilities
rand = "0.8"
base64 = "0.22"
mime_guess = "2"
thiserror = "1"
parking_lot = "0.12"
arc-swap = "1"
dashmap = "6"
futures = "0.3"
tokio-stream = "0.1"

# Async
async-trait = "0.1"

# Database (SQLite via rusqlite with bundled SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }

# Token estimation (BPE-based, same as aisix)
tiktoken-rs = "0.12"

# In-memory cache (same as aisix)
moka = { version = "0.12", features = ["future"] }

# Regex for keyword guardrail
regex = "1"

[dev-dependencies]
tempfile = "3"
